device: cuda

detector:
  model_path: weights/yolov8_plate.pt
  conf_threshold: 0.35
  iou_threshold: 0.45
  img_size: 640
  max_det: 8
  half: true          # fp16 on GPU; ignored on CPU
  pad_ratio: 0.06     # grow each box slightly so tight boxes do not clip glyphs

recognizer:
  model_path: weights/resnet_crnn_iran.pt
  backbone: resnet18
  img_height: 64
  img_width: 192
  charset: "0123456789ابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهیDS"
  # Constrained decoding: restrict the plate LETTER to this set. Digits are never
  # constrained.
  #
  # KEEP THIS EMPTY IN PRODUCTION. If a visitor or contractor drives in with a
  # different plate class, a constraint rewrites their letter instead of reading
  # it -- and a rewritten plate that happens to match a registered vehicle shows
  # the wrong driver at the barrier, confidently.
  #
  # Its real use is offline: set it while running tools/autolabel_plates.py over
  # photos you already know are one class, to bootstrap training data for that
  # letter. Then retrain and deploy with it empty again.
  allowed_letters: ""
  half: true
  pretrained: true    # ImageNet init, used by training only

camera:
  source: 0
  width: 1280
  height: 720
  fps: 30

database:
  path: data/vehicles.db
  seed_demo: false    # keep false in production so real records are never seeded over

display:
  window_name: "Iranian LPR - Mine Gate"
  font_scale: 1.1
  thickness: 2
  fullscreen: true
  hold_seconds: 5.0   # keep the driver panel up this long after the truck passes
  font_path: ""       # a .ttf with Persian glyphs; auto-detected when empty

preprocessing:
  clahe_clip: 3.0
  bilateral_d: 9
  bilateral_sigma: 75
  deskew_enabled: true
  sharpen_enabled: true
  auto_enhance: true       # adapt to glare / dust / night per crop
  vote_window_seconds: 2.0 # multi-frame fusion window
  min_votes: 3
  min_vote_score: 1.5

capture:
  enabled: true
  output_dir: captures
  save_full_frame: true      # the vehicle photo the operator audits against
  save_raw: true             # plate crop exactly as the detector cut it
  save_enhanced: true        # the variant the OCR actually read
  annotate: true             # draw the plate box + confidences on the full frame
  jpeg_quality: 90
  # A plate is not re-saved until it has been absent this long, so one vehicle
  # pass produces one capture instead of one every few seconds at the barrier.
  min_interval_seconds: 3.0
  # Disk retention, 0 = keep everything. Set at least one on a 24/7 gate.
  max_files: 20000
  max_age_days: 30

training:
  detector:
    epochs: 100
    batch: 16
    img_size: 640
    patience: 25
    lr0: 0.001
    base_model: yolov8s.pt
  recognizer:
    epochs: 60
    batch: 32
    lr: 0.0003
    weight_decay: 0.0001
    workers: 4
    val_split: 0.05
    augment: true
    # Even out the plate-letter distribution during sampling. 0 = natural
    # distribution, 1 = fully balanced. Rare letters are otherwise drowned out:
    # the model learns to guess common ones because that pays statistically.
    # Letters named in recognizer.allowed_letters get an extra 2x boost.
    letter_balance: 1.0
    # Extra 2x sampling weight for letters this site actually sees. Independent
    # of recognizer.allowed_letters: emphasise a letter during TRAINING so the
    # model truly learns it, while still deploying with no inference-time mask.
    # Mine gate (yellow public plates): "ع".  General/municipal: leave empty.
    boost_letters: "ع"
